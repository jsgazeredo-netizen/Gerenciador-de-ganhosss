<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador Moto Uber</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen pb-12 font-sans">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i data-lucide="bike" class="text-emerald-400 w-7 h-7"></i>
        <h1 class="text-xl font-bold tracking-wide">Moto<span class="text-emerald-400">Control</span></h1>
      </div>
      <button onclick="limparDados()" class="text-xs text-red-400 hover:text-red-300 flex items-center gap-1">
        <i data-lucide="trash-2" class="w-4 h-4"></i> Resetar
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Indicador de Lucro/Resumo -->
    <section class="grid grid-cols-2 gap-3">
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
        <p class="text-xs text-gray-400 font-medium uppercase">Faturamento Total</p>
        <p id="totalGanhos" class="text-2xl font-black text-emerald-400 mt-1">R$ 0,00</p>
      </div>
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
        <p class="text-xs text-gray-400 font-medium uppercase">Gastos (Comb.+Manut.)</p>
        <p id="totalGastos" class="text-2xl font-black text-red-400 mt-1">R$ 0,00</p>
      </div>
      <div class="col-span-2 bg-gradient-to-r from-emerald-900/40 to-gray-800 p-4 rounded-xl border border-emerald-500/30 flex justify-between items-center">
        <div>
          <p class="text-xs text-emerald-300 font-bold uppercase tracking-wider">Lucro Líquido</p>
          <p id="lucroLiquido" class="text-3xl font-black text-white mt-1">R$ 0,00</p>
        </div>
        <div class="text-right">
          <p class="text-xs text-gray-400">Total de Corridas</p>
          <p id="totalCorridas" class="text-xl font-bold text-gray-200">0</p>
        </div>
      </div>
    </section>

    <!-- Formulário: Registrar Novo Rodado / Corrida -->
    <section class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg">
      <h2 class="text-base font-bold text-emerald-400 mb-4 flex items-center gap-2">
        <i data-lucide="plus-circle" class="w-5 h-5"></i> Novo Registro
      </h2>
      <form id="formRegistro" class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Tipo de Entrada</label>
          <select id="tipo" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            <option value="ganho">💰 Ganho (Uber/99/Entregas)</option>
            <option value="combustivel">⛽ Combustível</option>
            <option value="manutencao">🔧 Manutenção / Peças</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Valor (R$)</label>
            <input type="number" step="0.01" id="valor" placeholder="0.00" required class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">KM Rodados (Opcional)</label>
            <input type="number" id="km" placeholder="Ex: 12.5" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1">Descrição / Observação</label>
          <input type="text" id="descricao" placeholder="Ex: Corrida Centro, Troca de óleo..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>

        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-bold py-3 rounded-lg shadow-md transition-all flex items-center justify-center gap-2">
          <i data-lucide="save" class="w-5 h-5"></i> Salvar Registro
        </button>
      </form>
    </section>

    <!-- Lista de Histórico Recente -->
    <section class="bg-gray-800 p-5 rounded-xl border border-gray-700">
      <h2 class="text-base font-bold text-gray-200 mb-4 flex items-center gap-2">
        <i data-lucide="history" class="w-5 h-5 text-gray-400"></i> Histórico Recente
      </h2>
      <div id="listaHistorico" class="space-y-3 max-h-60 overflow-y-auto pr-1">
        <!-- Itens inseridos dinamicamente -->
        <p class="text-xs text-gray-500 text-center py-4">Nenhum registro cadastrado ainda.</p>
      </div>
    </section>

  </main>

  <script>
    // Inicialização do Lucide Icons
    lucide.createIcons();

    // Estado da Aplicação
    let registros = JSON.parse(localStorage.getItem('motoControl_registros')) || [];

    const form = document.getElementById('formRegistro');
    const listaHistorico = document.getElementById('listaHistorico');

    // Salvar novo registro
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const tipo = document.getElementById('tipo').value;
      const valor = parseFloat(document.getElementById('valor').value);
      const km = parseFloat(document.getElementById('km').value) || 0;
      const descricao = document.getElementById('descricao').value || (tipo === 'ganho' ? 'Corrida' : tipo);

      const novoRegistro = {
        id: Date.now(),
        tipo,
        valor,
        km,
        descricao,
        data: new Date().toLocaleDateString('pt-BR', { hour: '2-digit', minute: '2-digit' })
      };

      registros.unshift(novoRegistro);
      salvarEAtualizar();
      form.reset();
    });

    // Deletar item
    function deletarItem(id) {
      registros = registros.filter(item => item.id !== id);
      salvarEAtualizar();
    }

    // Limpar tudo
    function limparDados() {
      if (confirm("Tem certeza que deseja apagar todos os registros?")) {
        registros = [];
        salvarEAtualizar();
      }
    }

    // Atualizar UI e LocalStorage
    function salvarEAtualizar() {
      localStorage.setItem('motoControl_registros', JSON.stringify(registros));
      renderizar();
    }

    function formatarMoeda(valor) {
      return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function renderizar() {
      // Cálculos
      let ganhos = 0;
      let gastos = 0;
      let totalCorridas = 0;

      listaHistorico.innerHTML = '';

      if (registros.length === 0) {
        listaHistorico.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">Nenhum registro cadastrado ainda.</p>`;
      }

      registros.forEach(item => {
        if (item.tipo === 'ganho') {
          ganhos += item.valor;
          totalCorridas++;
        } else {
          gastos += item.valor;
        }

        // Renderizar item na lista
        const isGanho = item.tipo === 'ganho';
        const corTexto = isGanho ? 'text-emerald-400' : 'text-red-400';
        const sinal = isGanho ? '+' : '-';
        const icone = item.tipo === 'ganho' ? 'bike' : (item.tipo === 'combustivel' ? 'fuel' : 'wrench');

        const div = document.createElement('div');
        div.className = 'flex justify-between items-center bg-gray-900 p-3 rounded-lg border border-gray-700/60 text-xs';
        div.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="p-2 rounded-lg bg-gray-800">
              <i data-lucide="${icone}" class="w-4 h-4 ${corTexto}"></i>
            </div>
            <div>
              <p class="font-bold text-gray-200">${item.descricao}</p>
              <p class="text-gray-500 text-[10px]">${item.data} ${item.km ? '• ' + item.km + ' km' : ''}</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="font-bold ${corTexto} text-sm">${sinal} ${formatarMoeda(item.valor)}</span>
            <button onclick="deletarItem(${item.id})" class="text-gray-500 hover:text-red-400">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
        `;
        listaHistorico.appendChild(div);
      });

      // Atualizar cards
      document.getElementById('totalGanhos').textContent = formatarMoeda(ganhos);
      document.getElementById('totalGastos').textContent = formatarMoeda(gastos);
      document.getElementById('lucroLiquido').textContent = formatarMoeda(ganhos - gastos);
      document.getElementById('totalCorridas').textContent = totalCorridas;

      lucide.createIcons();
    }

    // Carregamento inicial
    renderizar();
  </script>
</body>
</html>
